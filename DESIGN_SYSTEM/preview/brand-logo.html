<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
@font-face{font-family:'Inter';src:url('../../fonts/Inter-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
@font-face{font-family:'Inter';src:url('../../fonts/Inter-Italic-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:italic;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Light.ttf')format('truetype');font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Regular.ttf')format('truetype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Medium.ttf')format('truetype');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-SemiBold.ttf')format('truetype');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Bold.ttf')format('truetype');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-ExtraBold.ttf')format('truetype');font-weight:800;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Black.ttf')format('truetype');font-weight:900;font-style:normal;font-display:swap;}
</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-bg-primary); font-family: var(--font-body); padding: 24px; display: flex; gap: 24px; align-items: flex-start; }
.logo-box { background: var(--color-bg-primary); border: 1px solid rgba(255,255,255,0.07); border-radius: 14px; padding: 20px 28px; display: flex; align-items: center; justify-content: center; }
.logo-box-card { background: var(--color-bg-secondary); border-radius: 14px; padding: 20px 28px; display: flex; align-items: center; justify-content: center; }
.tagline-block { background: linear-gradient(135deg, #1A1625 0%, #0D0914 100%); border-radius: 14px; padding: 20px 24px; border: 1px solid rgba(181,123,255,0.15); position: relative; overflow: hidden; min-width: 200px; }
.glow { position: absolute; top: -20px; right: -20px; width: 100px; height: 100px; background: radial-gradient(circle, rgba(181,123,255,0.25) 0%, transparent 70%); pointer-events: none; }
.tl { font-family: var(--font-display); font-size: 15px; font-weight: 600; color: rgba(255,255,255,0.92); line-height: 1.4; position: relative; }
.tl span { color: #B57BFF; }
.sub { font-size: 11px; color: rgba(255,255,255,0.35); margin-top: 6px; letter-spacing: 0.04em; position: relative; }
.mark-row { display: flex; gap: 12px; align-items: center; }
.mark-wrap { background: var(--color-bg-secondary); border-radius: 12px; padding: 14px; border: 1px solid rgba(255,255,255,0.07); }
</style>
</head>
<body>
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="logo-box"><img src="../assets/logo.svg" alt="GripFit" style="height:40px"></div>
    <div class="logo-box-card"><img src="../assets/logo.svg" alt="GripFit" style="height:40px"></div>
  </div>
  <div style="display:flex;flex-direction:column;gap:14px">
    <div class="mark-row">
      <div class="mark-wrap"><img src="../assets/logo-mark.svg" alt="Mark" style="height:36px;width:36px"></div>
      <div style="font-size:12px;color:rgba(255,255,255,0.4);line-height:1.5">Icon mark<br>48×48px</div>
    </div>
    <div class="tagline-block">
      <div class="glow"></div>
      <div class="tl">The future of<br><span>human readiness.</span></div>
      <div class="sub">GripFit · Smart Dynamometer</div>
    </div>
  </div>
</body>
</html>
