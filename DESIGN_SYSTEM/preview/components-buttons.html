<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
@font-face{font-family:'Inter';src:url('../../fonts/Inter-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
@font-face{font-family:'Inter';src:url('../../fonts/Inter-Italic-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:italic;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Light.ttf')format('truetype');font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Regular.ttf')format('truetype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Medium.ttf')format('truetype');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-SemiBold.ttf')format('truetype');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Bold.ttf')format('truetype');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-ExtraBold.ttf')format('truetype');font-weight:800;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Black.ttf')format('truetype');font-weight:900;font-style:normal;font-display:swap;}
</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-bg-primary); font-family: var(--font-body); padding: 24px; display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
.btn { display: inline-flex; align-items: center; gap: 8px; border: none; cursor: pointer; font-family: var(--font-body); font-weight: 500; transition: all 200ms cubic-bezier(0.4,0,0.2,1); }
.btn-primary { background: var(--color-accent); color: #0D0914; font-size: 14px; padding: 10px 22px; border-radius: 10px; box-shadow: 0 0 20px rgba(181,123,255,0.3); }
.btn-primary:hover { background: var(--color-accent-strong); box-shadow: 0 0 28px rgba(181,123,255,0.45); transform: translateY(-1px); }
.btn-secondary { background: rgba(181,123,255,0.12); color: var(--color-accent); font-size: 14px; padding: 10px 22px; border-radius: 10px; border: 1px solid rgba(181,123,255,0.3); }
.btn-ghost { background: transparent; color: rgba(255,255,255,0.7); font-size: 14px; padding: 10px 22px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
.btn-danger { background: rgba(248,113,113,0.12); color: #F87171; font-size: 14px; padding: 10px 22px; border-radius: 10px; border: 1px solid rgba(248,113,113,0.25); }
.btn-sm { font-size: 12px; padding: 7px 14px; border-radius: 8px; }
.btn-lg { font-size: 16px; padding: 14px 32px; border-radius: 12px; }
.btn-pill { border-radius: 9999px; }
.btn-icon { width: 38px; height: 38px; padding: 0; justify-content: center; border-radius: 10px; background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: rgba(255,255,255,0.6); font-size: 16px; }
.btn-disabled { opacity: 0.35; cursor: not-allowed; }
.divider { width: 100%; height: 1px; background: var(--color-border-subtle); margin: 4px 0; }
</style>
</head>
<body>
  <!-- Primary -->
  <button class="btn btn-primary">Track readiness</button>
  <button class="btn btn-primary btn-sm">View data</button>
  <button class="btn btn-primary btn-lg">Begin session</button>
  <button class="btn btn-primary btn-pill">Optimize now</button>
  <div class="divider"></div>
  <!-- Secondary & Ghost -->
  <button class="btn btn-secondary">View breakdown</button>
  <button class="btn btn-ghost">Learn more</button>
  <button class="btn btn-danger">Reset data</button>
  <button class="btn btn-icon">＋</button>
  <button class="btn btn-primary btn-disabled" disabled>Unavailable</button>
</body>
</html>
