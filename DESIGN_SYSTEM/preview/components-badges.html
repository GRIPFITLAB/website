<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
@font-face{font-family:'Inter';src:url('../../fonts/Inter-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
@font-face{font-family:'Inter';src:url('../../fonts/Inter-Italic-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:italic;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Light.ttf')format('truetype');font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Regular.ttf')format('truetype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Medium.ttf')format('truetype');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-SemiBold.ttf')format('truetype');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Bold.ttf')format('truetype');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-ExtraBold.ttf')format('truetype');font-weight:800;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Black.ttf')format('truetype');font-weight:900;font-style:normal;font-display:swap;}
</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-bg-primary); font-family: var(--font-body); padding: 24px; display: flex; flex-wrap: wrap; gap: 10px; align-items: flex-start; }
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 500; padding: 4px 10px; border-radius: 6px; white-space: nowrap; }
.dot { width: 6px; height: 6px; border-radius: 50%; flex-shrink: 0; }
.pill { border-radius: 9999px; padding: 4px 12px; }
.divider { width: 100%; height: 1px; background: rgba(255,255,255,0.06); }
</style>
</head>
<body>
  <!-- Status badges -->
  <span class="badge" style="background:rgba(74,222,128,0.12);color:#4ADE80"><span class="dot" style="background:#4ADE80"></span>Excellent</span>
  <span class="badge" style="background:rgba(74,222,128,0.08);color:#86EFAC"><span class="dot" style="background:#86EFAC"></span>Good</span>
  <span class="badge" style="background:rgba(251,191,36,0.12);color:#FBBF24"><span class="dot" style="background:#FBBF24"></span>Moderate</span>
  <span class="badge" style="background:rgba(248,113,113,0.12);color:#F87171"><span class="dot" style="background:#F87171"></span>Low</span>
  <span class="badge" style="background:rgba(239,68,68,0.12);color:#EF4444"><span class="dot" style="background:#EF4444"></span>Critical</span>

  <div class="divider"></div>

  <!-- Accent pills -->
  <span class="badge pill" style="background:rgba(181,123,255,0.12);color:#B57BFF;border:1px solid rgba(181,123,255,0.25)">Neural Violet</span>
  <span class="badge pill" style="background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.10)">Today</span>
  <span class="badge pill" style="background:rgba(255,255,255,0.06);color:rgba(255,255,255,0.6);border:1px solid rgba(255,255,255,0.10)">Apr 26</span>
  <span class="badge pill" style="background:#B57BFF;color:#0D0914;font-weight:600">Active</span>

  <div class="divider"></div>

  <!-- Label chips -->
  <span class="badge" style="background:rgba(96,165,250,0.10);color:#60A5FA;font-size:10px;letter-spacing:0.06em;text-transform:uppercase">HRV</span>
  <span class="badge" style="background:rgba(96,165,250,0.10);color:#60A5FA;font-size:10px;letter-spacing:0.06em;text-transform:uppercase">RHR</span>
  <span class="badge" style="background:rgba(96,165,250,0.10);color:#60A5FA;font-size:10px;letter-spacing:0.06em;text-transform:uppercase">Sleep</span>
  <span class="badge" style="background:rgba(96,165,250,0.10);color:#60A5FA;font-size:10px;letter-spacing:0.06em;text-transform:uppercase">Load</span>
</body>
</html>
