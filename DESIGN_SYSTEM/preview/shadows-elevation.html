<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
@font-face{font-family:'Inter';src:url('../../fonts/Inter-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
@font-face{font-family:'Inter';src:url('../../fonts/Inter-Italic-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:italic;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Light.ttf')format('truetype');font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Regular.ttf')format('truetype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Medium.ttf')format('truetype');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-SemiBold.ttf')format('truetype');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Bold.ttf')format('truetype');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-ExtraBold.ttf')format('truetype');font-weight:800;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Black.ttf')format('truetype');font-weight:900;font-style:normal;font-display:swap;}
</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-bg-primary); font-family: var(--font-body); padding: 24px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }
.shadow-item { display: flex; flex-direction: column; gap: 10px; align-items: center; }
.shadow-box { width: 80px; height: 60px; background: var(--color-bg-secondary); border-radius: 14px; border: 1px solid var(--color-border-subtle); }
.shadow-label { font-family: monospace; font-size: 10px; color: rgba(255,255,255,0.4); text-align: center; }
</style>
</head>
<body>
  <div class="shadow-item">
    <div class="shadow-box" style="box-shadow: 0 2px 8px rgba(13,9,20,0.5)"></div>
    <div class="shadow-label">shadow-sm</div>
  </div>
  <div class="shadow-item">
    <div class="shadow-box" style="box-shadow: 0 4px 24px rgba(13,9,20,0.6), 0 1px 4px rgba(181,123,255,0.06)"></div>
    <div class="shadow-label">shadow-md</div>
  </div>
  <div class="shadow-item">
    <div class="shadow-box" style="box-shadow: 0 8px 40px rgba(13,9,20,0.7), 0 2px 8px rgba(181,123,255,0.10)"></div>
    <div class="shadow-label">shadow-lg</div>
  </div>
  <div class="shadow-item">
    <div class="shadow-box" style="box-shadow: 0 0 12px rgba(181,123,255,0.25)"></div>
    <div class="shadow-label">glow-sm</div>
  </div>
  <div class="shadow-item">
    <div class="shadow-box" style="box-shadow: 0 0 24px rgba(181,123,255,0.35)"></div>
    <div class="shadow-label">glow-md</div>
  </div>
  <div class="shadow-item">
    <div class="shadow-box" style="box-shadow: 0 0 48px rgba(181,123,255,0.45); border-color: rgba(181,123,255,0.2)"></div>
    <div class="shadow-label">glow-lg</div>
  </div>
  <div class="shadow-item">
    <div class="shadow-box" style="background:rgba(26,22,37,0.7);backdrop-filter:blur(20px);border-color:rgba(255,255,255,0.1)"></div>
    <div class="shadow-label">glass</div>
  </div>
</body>
</html>
