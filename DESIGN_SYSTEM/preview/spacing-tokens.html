<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
@font-face{font-family:'Inter';src:url('../../fonts/Inter-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
@font-face{font-family:'Inter';src:url('../../fonts/Inter-Italic-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:italic;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Light.ttf')format('truetype');font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Regular.ttf')format('truetype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Medium.ttf')format('truetype');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-SemiBold.ttf')format('truetype');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Bold.ttf')format('truetype');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-ExtraBold.ttf')format('truetype');font-weight:800;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Black.ttf')format('truetype');font-weight:900;font-style:normal;font-display:swap;}
</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-bg-primary); font-family: var(--font-body); padding: 20px; display: flex; gap: 16px; }
.col { flex: 1; }
.section-label { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: var(--color-text-tertiary); margin-bottom: 10px; }
.token-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.space-block { background: rgba(181,123,255,0.25); border-radius: 3px; height: 16px; }
.token-name { font-family: monospace; font-size: 11px; color: rgba(255,255,255,0.5); width: 64px; flex-shrink: 0; }
.token-val { font-size: 10px; color: rgba(255,255,255,0.3); }
/* Radii col */
.radius-row { display: flex; align-items: center; gap: 10px; margin-bottom: 8px; }
.radius-box { width: 40px; height: 28px; background: rgba(181,123,255,0.2); border: 1px solid rgba(181,123,255,0.35); }
</style>
</head>
<body>
  <div class="col">
    <div class="section-label">Spacing scale</div>
    <div class="token-row"><span class="token-name">space-1</span><div class="space-block" style="width:4px"></div><span class="token-val">4px</span></div>
    <div class="token-row"><span class="token-name">space-2</span><div class="space-block" style="width:8px"></div><span class="token-val">8px</span></div>
    <div class="token-row"><span class="token-name">space-3</span><div class="space-block" style="width:12px"></div><span class="token-val">12px</span></div>
    <div class="token-row"><span class="token-name">space-4</span><div class="space-block" style="width:16px"></div><span class="token-val">16px</span></div>
    <div class="token-row"><span class="token-name">space-6</span><div class="space-block" style="width:24px"></div><span class="token-val">24px</span></div>
    <div class="token-row"><span class="token-name">space-8</span><div class="space-block" style="width:32px"></div><span class="token-val">32px</span></div>
    <div class="token-row"><span class="token-name">space-12</span><div class="space-block" style="width:48px"></div><span class="token-val">48px</span></div>
    <div class="token-row"><span class="token-name">space-16</span><div class="space-block" style="width:64px"></div><span class="token-val">64px</span></div>
  </div>
  <div class="col">
    <div class="section-label">Border radius</div>
    <div class="radius-row"><div class="radius-box" style="border-radius:6px"></div><span class="token-name">radius-sm</span><span class="token-val">6px</span></div>
    <div class="radius-row"><div class="radius-box" style="border-radius:10px"></div><span class="token-name">radius-md</span><span class="token-val">10px</span></div>
    <div class="radius-row"><div class="radius-box" style="border-radius:16px"></div><span class="token-name">radius-lg</span><span class="token-val">16px</span></div>
    <div class="radius-row"><div class="radius-box" style="border-radius:24px"></div><span class="token-name">radius-xl</span><span class="token-val">24px</span></div>
    <div class="radius-row"><div class="radius-box" style="border-radius:9999px"></div><span class="token-name">radius-pill</span><span class="token-val">9999px</span></div>
  </div>
</body>
</html>
