<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
@font-face{font-family:'Inter';src:url('../../fonts/Inter-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
@font-face{font-family:'Inter';src:url('../../fonts/Inter-Italic-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:italic;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Light.ttf')format('truetype');font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Regular.ttf')format('truetype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Medium.ttf')format('truetype');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-SemiBold.ttf')format('truetype');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Bold.ttf')format('truetype');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-ExtraBold.ttf')format('truetype');font-weight:800;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Black.ttf')format('truetype');font-weight:900;font-style:normal;font-display:swap;}
</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-bg-primary); font-family: var(--font-body); padding: 24px; display: flex; gap: 16px; align-items: flex-start; flex-wrap: wrap; }

/* Score Ring */
.ring-wrap { display: flex; flex-direction: column; align-items: center; gap: 8px; }
.ring-label { font-size: 10px; font-weight: 500; letter-spacing: 0.08em; text-transform: uppercase; color: rgba(255,255,255,0.4); }

/* Horizontal bar metric */
.bar-metric { background: var(--color-bg-secondary); border-radius: 14px; padding: 14px 16px; width: 200px; border: 1px solid rgba(255,255,255,0.07); }
.bm-head { display: flex; justify-content: space-between; align-items: baseline; margin-bottom: 8px; }
.bm-name { font-size: 12px; color: rgba(255,255,255,0.5); }
.bm-val { font-family: var(--font-display); font-size: 18px; font-weight: 600; color: rgba(255,255,255,0.92); }
.bm-unit { font-size: 11px; color: rgba(255,255,255,0.35); margin-left: 2px; }
.bar-track { height: 4px; background: rgba(255,255,255,0.08); border-radius: 9999px; }
.bar-fill { height: 100%; border-radius: 9999px; }
</style>
</head>
<body>

  <!-- SVG Score Ring — Excellent -->
  <div class="ring-wrap">
    <svg width="100" height="100" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#4ADE80" stroke-width="8"
        stroke-dasharray="263.9" stroke-dashoffset="26.4"
        stroke-linecap="round" transform="rotate(-90 50 50)"
        style="filter:drop-shadow(0 0 6px rgba(74,222,128,0.6))"/>
      <text x="50" y="46" text-anchor="middle" font-family="Poppins,sans-serif" font-size="24" font-weight="700" fill="white">94</text>
      <text x="50" y="60" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" letter-spacing="1">READINESS</text>
    </svg>
    <span class="ring-label" style="color:#4ADE80">Excellent</span>
  </div>

  <!-- Moderate -->
  <div class="ring-wrap">
    <svg width="100" height="100" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#FBBF24" stroke-width="8"
        stroke-dasharray="263.9" stroke-dashoffset="100"
        stroke-linecap="round" transform="rotate(-90 50 50)"
        style="filter:drop-shadow(0 0 6px rgba(251,191,36,0.5))"/>
      <text x="50" y="46" text-anchor="middle" font-family="Poppins,sans-serif" font-size="24" font-weight="700" fill="white">62</text>
      <text x="50" y="60" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="rgba(255,255,255,0.4)" letter-spacing="1">READINESS</text>
    </svg>
    <span class="ring-label" style="color:#FBBF24">Moderate</span>
  </div>

  <!-- Accent ring — Neural Violet -->
  <div class="ring-wrap">
    <svg width="100" height="100" viewBox="0 0 100 100">
      <circle cx="50" cy="50" r="42" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="8"/>
      <circle cx="50" cy="50" r="42" fill="none" stroke="#B57BFF" stroke-width="8"
        stroke-dasharray="263.9" stroke-dashoffset="52.8"
        stroke-linecap="round" transform="rotate(-90 50 50)"
        style="filter:drop-shadow(0 0 8px rgba(181,123,255,0.6))"/>
      <text x="50" y="46" text-anchor="middle" font-family="Poppins,sans-serif" font-size="24" font-weight="700" fill="white">80</text>
      <text x="50" y="60" text-anchor="middle" font-family="Inter,sans-serif" font-size="9" fill="rgba(181,123,255,0.7)" letter-spacing="1">NEURAL</text>
    </svg>
    <span class="ring-label" style="color:#B57BFF">Neural Drive</span>
  </div>

  <!-- Bar metrics -->
  <div style="display:flex;flex-direction:column;gap:10px">
    <div class="bar-metric">
      <div class="bm-head"><span class="bm-name">HRV</span><span><span class="bm-val">68</span><span class="bm-unit">ms</span></span></div>
      <div class="bar-track"><div class="bar-fill" style="width:78%;background:#4ADE80;box-shadow:0 0 8px rgba(74,222,128,0.4)"></div></div>
    </div>
    <div class="bar-metric">
      <div class="bm-head"><span class="bm-name">Resting HR</span><span><span class="bm-val">52</span><span class="bm-unit">bpm</span></span></div>
      <div class="bar-track"><div class="bar-fill" style="width:55%;background:#B57BFF;box-shadow:0 0 8px rgba(181,123,255,0.4)"></div></div>
    </div>
    <div class="bar-metric">
      <div class="bm-head"><span class="bm-name">Sleep</span><span><span class="bm-val">7h 42m</span></span></div>
      <div class="bar-track"><div class="bar-fill" style="width:88%;background:#60A5FA;box-shadow:0 0 8px rgba(96,165,250,0.4)"></div></div>
    </div>
  </div>

</body>
</html>
