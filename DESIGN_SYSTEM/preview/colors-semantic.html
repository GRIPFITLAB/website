<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
@font-face{font-family:'Inter';src:url('../../fonts/Inter-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
@font-face{font-family:'Inter';src:url('../../fonts/Inter-Italic-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:italic;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Light.ttf')format('truetype');font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Regular.ttf')format('truetype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Medium.ttf')format('truetype');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-SemiBold.ttf')format('truetype');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Bold.ttf')format('truetype');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-ExtraBold.ttf')format('truetype');font-weight:800;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Black.ttf')format('truetype');font-weight:900;font-style:normal;font-display:swap;}
</style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-bg-primary); font-family: var(--font-body); padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
  .item { border-radius: 10px; overflow: hidden; }
  .chip { height: 56px; display: flex; align-items: center; justify-content: center; }
  .chip-label { font-size: 12px; font-weight: 600; }
  .meta { padding: 7px 10px; background: var(--color-bg-secondary); }
  .meta-name { font-size: 11px; font-weight: 600; color: var(--color-text-primary); }
  .meta-hex { font-family: monospace; font-size: 10px; color: var(--color-text-tertiary); }
</style>
</head>
<body>
<div class="grid">
  <div class="item">
    <div class="chip" style="background:var(--color-success-dim)">
      <span class="chip-label" style="color:#4ADE80">Success</span>
    </div>
    <div class="meta"><div class="meta-name">Success</div><div class="meta-hex">#4ADE80</div></div>
  </div>
  <div class="item">
    <div class="chip" style="background:var(--color-warning-dim)">
      <span class="chip-label" style="color:#FBBF24">Warning</span>
    </div>
    <div class="meta"><div class="meta-name">Warning</div><div class="meta-hex">#FBBF24</div></div>
  </div>
  <div class="item">
    <div class="chip" style="background:var(--color-danger-dim)">
      <span class="chip-label" style="color:#F87171">Danger</span>
    </div>
    <div class="meta"><div class="meta-name">Danger</div><div class="meta-hex">#F87171</div></div>
  </div>
  <div class="item">
    <div class="chip" style="background:var(--color-info-dim)">
      <span class="chip-label" style="color:#60A5FA">Info</span>
    </div>
    <div class="meta"><div class="meta-name">Info</div><div class="meta-hex">#60A5FA</div></div>
  </div>
  <!-- Text hierarchy -->
  <div class="item" style="grid-column:span 2">
    <div class="chip" style="background:var(--color-bg-secondary); flex-direction:column; gap:4px; height:70px">
      <span style="font-size:13px;color:rgba(255,255,255,0.95)">Primary text — 95%</span>
      <span style="font-size:12px;color:rgba(255,255,255,0.60)">Secondary text — 60%</span>
      <span style="font-size:11px;color:rgba(255,255,255,0.35)">Tertiary text — 35%</span>
    </div>
    <div class="meta"><div class="meta-name">Text hierarchy</div><div class="meta-hex">white at opacity</div></div>
  </div>
  <div class="item" style="grid-column:span 2">
    <div class="chip" style="background:var(--color-bg-secondary); flex-direction:column; gap:5px; height:70px">
      <span style="font-size:12px;color:rgba(255,255,255,0.08);background:rgba(255,255,255,0.08);padding:1px 8px;border-radius:4px;border:1px solid rgba(255,255,255,0.08)">Subtle border</span>
      <span style="font-size:12px;color:rgba(255,255,255,0.60);background:transparent;padding:1px 8px;border-radius:4px;border:1px solid rgba(255,255,255,0.18)">Strong border</span>
      <span style="font-size:12px;color:#B57BFF;background:transparent;padding:1px 8px;border-radius:4px;border:1px solid rgba(181,123,255,0.4)">Accent border</span>
    </div>
    <div class="meta"><div class="meta-name">Border scale</div><div class="meta-hex">6% · 10% · 18% · accent</div></div>
  </div>
</div>
</body>
</html>
