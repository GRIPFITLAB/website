<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
@font-face{font-family:'Inter';src:url('../../fonts/Inter-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
@font-face{font-family:'Inter';src:url('../../fonts/Inter-Italic-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:italic;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Light.ttf')format('truetype');font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Regular.ttf')format('truetype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Medium.ttf')format('truetype');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-SemiBold.ttf')format('truetype');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Bold.ttf')format('truetype');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-ExtraBold.ttf')format('truetype');font-weight:800;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Black.ttf')format('truetype');font-weight:900;font-style:normal;font-display:swap;}
</style>
<style>
* { box-sizing: border-box; margin: 0; padding: 0; }
body { background: var(--color-bg-primary); font-family: var(--font-body); padding: 20px; display: flex; gap: 14px; flex-wrap: wrap; }
.card { background: var(--color-bg-secondary); border: 1px solid rgba(255,255,255,0.07); border-radius: 16px; padding: 18px; }
.card-glass { background: rgba(26,22,37,0.65); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.10); border-radius: 16px; padding: 18px; }
.card-accent { background: var(--color-bg-secondary); border: 1px solid rgba(181,123,255,0.25); border-radius: 16px; padding: 18px; box-shadow: 0 0 24px rgba(181,123,255,0.08); }
.card-label { font-size: 10px; font-weight: 500; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,0.35); margin-bottom: 8px; }
.card-value { font-family: var(--font-display); font-size: 36px; font-weight: 700; line-height: 1; letter-spacing: -0.03em; }
.card-sub { font-size: 12px; color: rgba(255,255,255,0.45); margin-top: 5px; }
.trend { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 500; padding: 2px 7px; border-radius: 6px; margin-top: 6px; }
.trend-up { background: rgba(74,222,128,0.12); color: #4ADE80; }
.trend-down { background: rgba(248,113,113,0.12); color: #F87171; }
</style>
</head>
<body>
  <!-- Default card -->
  <div class="card" style="width:160px">
    <div class="card-label">Readiness</div>
    <div class="card-value" style="color:#4ADE80">94</div>
    <div class="trend trend-up">↑ +3 pts</div>
    <div class="card-sub">Excellent today</div>
  </div>

  <!-- Glass card -->
  <div class="card-glass" style="width:160px">
    <div class="card-label">HRV</div>
    <div class="card-value" style="color:rgba(255,255,255,0.92)">68 <span style="font-size:16px;font-weight:400;color:rgba(255,255,255,0.35)">ms</span></div>
    <div class="trend trend-up">↑ +4ms</div>
    <div class="card-sub">Above baseline</div>
  </div>

  <!-- Accent card -->
  <div class="card-accent" style="width:160px">
    <div class="card-label">Neural Drive</div>
    <div class="card-value" style="color:#B57BFF">High</div>
    <div class="card-sub" style="color:#B57BFF;opacity:0.7">Peak window: 6h</div>
  </div>

  <!-- Warning card -->
  <div class="card" style="width:160px;border-color:rgba(251,191,36,0.2)">
    <div class="card-label">Recovery</div>
    <div class="card-value" style="color:#FBBF24">62</div>
    <div class="trend" style="background:rgba(251,191,36,0.12);color:#FBBF24">→ Stable</div>
    <div class="card-sub">Moderate load</div>
  </div>
</body>
</html>
