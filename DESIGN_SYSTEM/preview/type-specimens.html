<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<style>
@font-face{font-family:'Inter';src:url('../../fonts/Inter-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
@font-face{font-family:'Inter';src:url('../../fonts/Inter-Italic-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:italic;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Light.ttf')format('truetype');font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Regular.ttf')format('truetype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Medium.ttf')format('truetype');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-SemiBold.ttf')format('truetype');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Bold.ttf')format('truetype');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-ExtraBold.ttf')format('truetype');font-weight:800;font-style:normal;font-display:swap;}
* { box-sizing:border-box; margin:0; padding:0; -webkit-font-smoothing:antialiased; }
body { background:#0B1020; padding:24px; display:flex; gap:16px; }
.panel { flex:1; background:rgba(22,34,56,0.8); border-radius:16px; border:1px solid rgba(255,255,255,0.07); padding:18px; }
.plabel { font-family:'Inter',sans-serif; font-size:10px; font-weight:500; letter-spacing:0.1em; text-transform:uppercase; color:rgba(255,255,255,0.35); margin-bottom:12px; }
</style>
</head>
<body>
  <div class="panel">
    <div class="plabel">Peak grip force</div>
    <div style="font-family:'Poppins',sans-serif;font-size:60px;font-weight:700;line-height:1;letter-spacing:-0.04em;color:#4ADE80">84 <span style="font-size:20px;font-weight:300;color:rgba(255,255,255,0.4)">lbs</span></div>
    <div style="font-family:'Inter',sans-serif;font-size:12px;color:rgba(255,255,255,0.45);margin-top:6px">Left hand · Session PR</div>
  </div>
  <div class="panel">
    <div class="plabel">Session data</div>
    <div style="display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;justify-content:space-between"><span style="font-family:'Inter',sans-serif;font-size:13px;color:rgba(255,255,255,0.55)">Peak force</span><span style="font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:#4ADE80">84 lbs</span></div>
      <div style="display:flex;justify-content:space-between"><span style="font-family:'Inter',sans-serif;font-size:13px;color:rgba(255,255,255,0.55)">Endurance</span><span style="font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:#B57BFF">72%</span></div>
      <div style="display:flex;justify-content:space-between"><span style="font-family:'Inter',sans-serif;font-size:13px;color:rgba(255,255,255,0.55)">Fatigue drop</span><span style="font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:#FBBF24">−18%</span></div>
      <div style="display:flex;justify-content:space-between"><span style="font-family:'Inter',sans-serif;font-size:13px;color:rgba(255,255,255,0.55)">Readiness</span><span style="font-family:'Poppins',sans-serif;font-size:14px;font-weight:600;color:#4A8EE8">High</span></div>
    </div>
  </div>
  <div class="panel">
    <div class="plabel">Tagline</div>
    <div style="font-family:'Poppins',sans-serif;font-size:16px;font-weight:600;color:rgba(255,255,255,0.9);line-height:1.4">Measure your grip.<br/><span style="color:#B57BFF">Know your readiness.</span></div>
    <div style="font-family:'Inter',sans-serif;font-size:12px;color:rgba(255,255,255,0.38);margin-top:8px;line-height:1.6">Smart force tracking<br/>for athletes who demand precision.</div>
  </div>
</body>
</html>
