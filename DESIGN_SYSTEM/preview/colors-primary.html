<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
@font-face{font-family:'Inter';src:url('../../fonts/Inter-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
@font-face{font-family:'Inter';src:url('../../fonts/Inter-Italic-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:italic;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Light.ttf')format('truetype');font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Regular.ttf')format('truetype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Medium.ttf')format('truetype');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-SemiBold.ttf')format('truetype');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Bold.ttf')format('truetype');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-ExtraBold.ttf')format('truetype');font-weight:800;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Black.ttf')format('truetype');font-weight:900;font-style:normal;font-display:swap;}
</style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: var(--color-bg-primary); font-family: var(--font-body); padding: 20px; }
  .grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
  .swatch { border-radius: 12px; overflow: hidden; }
  .swatch-color { height: 70px; }
  .swatch-info { padding: 8px 10px; background: var(--color-bg-secondary); }
  .swatch-name { font-family: var(--font-display); font-size: 12px; font-weight: 600; color: var(--color-text-primary); }
  .swatch-hex { font-family: monospace; font-size: 11px; color: var(--color-text-secondary); margin-top: 2px; }
  .swatch-role { font-size: 10px; color: var(--color-text-tertiary); margin-top: 2px; }
</style>
</head>
<body>
<div class="grid">
  <div class="swatch">
    <div class="swatch-color" style="background:#0D0914;border:1px solid rgba(255,255,255,0.08)"></div>
    <div class="swatch-info">
      <div class="swatch-name">Deep Amethyst</div>
      <div class="swatch-hex">#0D0914</div>
      <div class="swatch-role">Primary background</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#1A1625"></div>
    <div class="swatch-info">
      <div class="swatch-name">Nebula Purple</div>
      <div class="swatch-hex">#1A1625</div>
      <div class="swatch-role">Cards · modals · panels</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#231D30"></div>
    <div class="swatch-info">
      <div class="swatch-name">Lifted Surface</div>
      <div class="swatch-hex">#231D30</div>
      <div class="swatch-role">Tertiary surface</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#B57BFF"></div>
    <div class="swatch-info">
      <div class="swatch-name">Neural Violet</div>
      <div class="swatch-hex">#B57BFF</div>
      <div class="swatch-role">Accent · interactive</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#C99BFF"></div>
    <div class="swatch-info">
      <div class="swatch-name">Violet Light</div>
      <div class="swatch-hex">#C99BFF</div>
      <div class="swatch-role">Hover state</div>
    </div>
  </div>
  <div class="swatch">
    <div class="swatch-color" style="background:#7A4FBF"></div>
    <div class="swatch-info">
      <div class="swatch-name">Violet Deep</div>
      <div class="swatch-hex">#7A4FBF</div>
      <div class="swatch-role">Pressed state</div>
    </div>
  </div>
</div>
</body>
</html>
