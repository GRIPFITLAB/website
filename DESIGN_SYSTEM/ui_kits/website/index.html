<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GripFit — Website UI Kit</title>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<style>
@font-face{font-family:'Inter';src:url('../../fonts/Inter-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:normal;font-display:swap;}
@font-face{font-family:'Inter';src:url('../../fonts/Inter-Italic-VariableFont_opsz_wght.ttf')format('truetype');font-weight:100 900;font-style:italic;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Light.ttf')format('truetype');font-weight:300;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Regular.ttf')format('truetype');font-weight:400;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Medium.ttf')format('truetype');font-weight:500;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-SemiBold.ttf')format('truetype');font-weight:600;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Bold.ttf')format('truetype');font-weight:700;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-ExtraBold.ttf')format('truetype');font-weight:800;font-style:normal;font-display:swap;}
@font-face{font-family:'Poppins';src:url('../../fonts/Poppins-Black.ttf')format('truetype');font-weight:900;font-style:normal;font-display:swap;}
</style>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-font-smoothing: antialiased; }
  html, body { height: 100%; }
  body {
    background: radial-gradient(ellipse at 50% 0%, rgba(40,60,160,0.25) 0%, transparent 55%),
                radial-gradient(ellipse at 90% 10%, rgba(100,50,200,0.12) 0%, transparent 45%),
                #0B1020;
    color: rgba(255,255,255,0.9);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="Nav.jsx"></script>
<script type="text/babel" src="HeroSection.jsx"></script>
<script type="text/babel" src="FeaturesSection.jsx"></script>
<script type="text/babel" src="HowItWorksSection.jsx"></script>
<script type="text/babel" src="SocialProofSection.jsx"></script>
<script type="text/babel" src="CTASection.jsx"></script>
<script type="text/babel" src="Footer.jsx"></script>
<script type="text/babel" src="InnerPages.jsx"></script>

<script type="text/babel">
  function Website() {
    const [page, setPage] = React.useState(
      () => localStorage.getItem('gf_web_page') || 'home'
    );
    const navigate = p => {
      setPage(p);
      localStorage.setItem('gf_web_page', p);
      window.scrollTo(0, 0);
    };

    return (
      <div>
        <WebNav page={page} navigate={navigate} />
        {page === 'home' && <>
          <HeroSection navigate={navigate} />
          <FeaturesSection />
          <HowItWorksSection />
          <SocialProofSection />
          <CTASection navigate={navigate} />
        </>}
        {page === 'product' && <ProductPage navigate={navigate} />}
        {page === 'science' && <SciencePage navigate={navigate} />}
        <WebFooter navigate={navigate} />
      </div>
    );
  }

  ReactDOM.createRoot(document.getElementById('root')).render(<Website />);
</script>
</body>
</html>
