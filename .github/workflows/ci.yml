name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR makes the in-flight run obsolete.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm run typecheck

      - run: npm test

      # The build proves every route still compiles and prerenders. It runs
      # with no secrets on purpose — the site has to stay deployable before
      # Brevo credentials exist (PRD R-014).
      - run: npm run build

      # A build that succeeds is not a page that serves. This starts the
      # production server and requests every route, which is the only gate
      # that catches a module throwing at request time. GETs only — see the
      # limits documented in scripts/smoke.mjs.
      - run: npm run smoke
